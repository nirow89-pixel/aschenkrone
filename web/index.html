<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Aschenkrone</title>
  <link rel="icon" type="image/png" href="../assets/ui/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu">
    <div class="cardbox">
      <img class="menu-logo" src="../assets/ui/logo.jpg" alt="" />
      <h1 class="menu-title">ASCHENKRONE</h1>
      <div class="menu-rule"><span>◆</span></div>
      <div id="root-menu">
        <button id="btn-continue" class="menu-btn">Fortsetzen</button>
        <button id="btn-new" class="menu-btn">Neues Spiel</button>
        <button id="btn-load" class="menu-btn">Laden</button>
        <button id="btn-options" class="menu-btn">Optionen</button>
      </div>
      <div id="options-menu" hidden>
        <p class="menu-note">Einstellungen folgen.</p>
        <button id="btn-back-options" class="menu-btn">Zurück</button>
      </div>
      <div id="new-menu" hidden>
        <input id="new-hero-name" maxlength="18" placeholder="Name" />
        <div class="tiny">Gesicht</div><div id="portrait-grid" class="grid faces"></div>
        <div class="tiny">Herkunft</div><div id="herkunft-grid" class="grid"></div>
        <button id="btn-back">Zurück</button>
        <button id="btn-enter">Ins Reich treten</button>
      </div>
      <div id="load-menu" hidden>
        <div id="slots"></div>
        <button id="btn-back-load">Zurück</button>
      </div>
    </div>
  </div>
  <div id="shell">
    <header id="chrome"><span>◆</span><span>Aschenkrone</span><span class="grow"></span><span class="topstat"><em>Tag</em><b id="top-day">–</b></span><span class="topstat"><em>Tageszeit</em><b id="top-phase">–</b></span><span class="topstat"><em>Gold</em><b id="top-gold">–</b></span><span class="topstat"><em>Gesundheit</em><b id="top-hp">–</b></span><button id="btn-esc" title="Optionen">⚙</button></header>
    <aside id="pane-face" class="pane"><div class="rail">Person</div><div class="pane-body"><div id="face-fill" hidden><img id="face-art" alt=""><div class="tiny" id="face-title"></div><h2 id="face-name"></h2><div class="tiny" id="face-bond"></div><p class="tiny" id="face-hint"></p></div></div></aside>
    <section id="pane-scene" class="pane"><div class="rail">Ort</div><div class="pane-body flush"><div class="scene" id="scene"><img id="scene-art" alt=""></div><div class="place-name" id="place-name">—</div><div class="place-blurb" id="place-blurb"></div><button class="rest-btn" id="btn-rest" hidden>Ruhen</button><div id="scene-sheet" hidden><div class="sheet-bar"><span id="sheet-title">—</span><button id="sheet-close">Schließen</button></div><div id="sheet-body"></div></div><div id="narrator" hidden><div class="scroll"><div class="scroll-title" id="narr-title">Erzähler</div><img id="narr-art" alt="" hidden><p id="narr-text"></p><button id="narr-close">Die Rolle schließen</button></div></div></div></section>
    <aside id="pane-hero" class="pane"><div class="rail">Charakter</div><div class="pane-body"><div class="portrait"><img id="portrait" alt=""></div><h2 id="hero-name">—</h2><div class="tiny" id="hero-meta">—</div><div class="statline"><em>Leben</em><span id="hp">0/0</span></div><div id="hpbar"></div><div class="statline"><em>Zeit</em><span id="phase">—</span></div><div class="statline"><em>Tag</em><span id="day">1</span></div><div class="statline"><em>Gold</em><span id="gold">0</span></div><div class="statline"><em>Angriff</em><span id="atk-val">0</span></div><div class="statline"><em>Panzer</em><span id="def-val">0</span></div><div class="statline"><em>Wille</em><span id="will-val">0</span></div><div class="statline"><em>Ort</em><span id="loc">—</span></div><div class="hero-acts"><button class="seal-act" data-sheet="inventory">◈<br>Beutel</button><button class="seal-act" data-sheet="quests">❧<br>Bitten</button><button class="seal-act" data-sheet="stats">✦<br>Werte</button><button class="seal-act" data-sheet="zeichen">✧<br>Zeichen</button></div><div id="hero-log" class="hero-log"></div></div></aside>
    <aside id="pane-map" class="pane"><div class="rail" id="map-rail">Karte</div><div class="pane-body flush"><div class="mapwrap" id="map"></div></div></aside>
    <section id="pane-talk" class="pane"><div class="rail">Gespräch</div><div class="pane-body"><div class="tiny" id="talk-who"></div><p id="talk-line"></p><div id="talk-choices"></div><div id="combat-acts"><button id="btn-fight">Kämpfen</button><button id="btn-flee">Entgleiten</button></div></div></section>
  </div>
  <div id="overlay" hidden><div class="overlay-card"><div class="sheet-bar"><span>Optionen</span><button id="overlay-close">Schließen</button></div><div id="overlay-body" style="padding:12px"></div></div></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="systeme.js"></script>
</body>
</html>
